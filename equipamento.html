<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viking RPG — Equipamento</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="tela-equipamento">

        <h1 class="titulo-equipamento">Escolha seus equipamentos</h1>
        <p class="subtitulo-equipamento">Você tem <span id="pontos-disponiveis"></span> pontos para gastar</p>

        <!-- ARMAS -->
        <section class="secao-equipamento">
            <h2 class="titulo-secao">⚔ Arma</h2>
            <div class="grade-equipamento" id="grade-armas"></div>
        </section>

        <!-- ARMADURAS -->
        <section class="secao-equipamento">
            <h2 class="titulo-secao">🛡 Armadura</h2>
            <div class="grade-equipamento" id="grade-armaduras"></div>
        </section>

        <div id="resumo-escolha">
            <p id="texto-resumo">Nenhum equipamento selecionado ainda.</p>
        </div>

        <button class="btn-acao" id="btnConfirmar" disabled>Confirmar e Batalhar</button>

    </div>

    <script src="js/guard.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/game.js"></script>
    <script src="js/equipamento.js"></script>
</body>
</html>
